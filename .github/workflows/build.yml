name: build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 37 and build tools
        run: |
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37" "platform-tools"
          sdkmanager "build-tools;37.0.0" || sdkmanager "build-tools;36.1.0"
          sdkmanager --list_installed

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kdeconnect-plus-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: warn
