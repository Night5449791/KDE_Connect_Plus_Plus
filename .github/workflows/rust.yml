name: Rust core

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: cargo test / clippy / fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -e {0}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: Test
        working-directory: rust
        run: cargo test --workspace --all-targets
      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

  android:
    name: Android cdylib (cargo-ndk)
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        shell: bash -e {0}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: false
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build for Android ABIs
        working-directory: rust
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o android-shell/app/src/main/jniLibs \
            build --release -p kc-android
      - uses: actions/upload-artifact@v4
        with:
          name: kc-android-jnilibs
          path: rust/android-shell/app/src/main/jniLibs/

  apk:
    name: Assemble Android debug APK
    runs-on: ubuntu-latest
    needs: android
    defaults:
      run:
        shell: bash -e {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Place Rust JNI libraries
        uses: actions/download-artifact@v4
        with:
          name: kc-android-jnilibs
          path: rust/android-shell/app/src/main/jniLibs
      - name: Verify JNI libraries
        run: find rust/android-shell/app/src/main/jniLibs -name '*.so' -printf '%P\n' | sort
      - name: Assemble debug APK
        working-directory: rust/android-shell
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: kc-android-debug-apk
          path: rust/android-shell/app/build/outputs/apk/debug/*.apk
