[package]
name = "kc-daemon"
description = "Headless KDE Connect daemon and command-line client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "kc-daemon"
path = "src/main.rs"

[dependencies]
kc-core.workspace = true
kc-protocol.workspace = true
kc-plugins.workspace = true
kc-transport.workspace = true

clap = { workspace = true, features = ["derive"] }
tokio.workspace = true
rustls.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
