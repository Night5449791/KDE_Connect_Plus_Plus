[workspace]
resolver = "3"
members = [
    "crates/kc-protocol",
    "crates/kc-core",
    "crates/kc-transport",
    "crates/kc-plugins",
    "crates/kc-daemon",
    "crates/kc-android",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only OR GPL-3.0-only"
rust-version = "1.85"
repository = "https://github.com/Night5449791/KDE_Connect_Plus_Plus"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rcgen = { version = "0.14", default-features = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
x509-parser = "0.18"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.9"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
socket2 = { version = "0.6", features = ["all"] }
jni = "0.21"

kc-protocol = { path = "crates/kc-protocol" }
kc-core = { path = "crates/kc-core" }
kc-transport = { path = "crates/kc-transport" }
kc-plugins = { path = "crates/kc-plugins" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
